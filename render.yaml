# render.yaml - Complete configuration for Render deployment
services:
  - type: web
    name: philtech-payroll
    runtime: php
    repo: https://github.com/MERVINMICOSA/PAYROLL.git
    branch: main
    buildCommand: |
      # Copy all files to the deployment directory
      cp -r * /opt/render/project/src/
      # Create logs directory
      mkdir -p /opt/render/project/src/logs
    startCommand: php -S 0.0.0.0:10000
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: philtech-payroll-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
    healthCheckPath: /api/health

databases:
  - name: philtech-payroll-db
    databaseName: payroll_db
    user: payroll_user
    plan: free
    postgresMajorVersion: 15