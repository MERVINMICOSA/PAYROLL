# render.yaml - Complete configuration for Render deployment
services:
  - type: web
    name: philtech-payroll
    runtime: docker
    repo: https://github.com/MERVINMICOSA/PAYROLL.git
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: philtech-payroll-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
    healthCheckPath: /api/health

databases:
  - name: philtech-payroll-db
    databaseName: payroll_db
    user: payroll_user
    plan: free
    postgresMajorVersion: 15