# render.yaml - Render deployment for Node.js app
services:
  - type: web
    name: philtech-payroll
    runtime: node
    repo: https://github.com/MERVINMICOSA/PAYROLL.git
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: philtech-payroll-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
    healthCheckPath: /api/health
    health_check:
      path: /api/health
      poll_interval_seconds: 30
      timeout_sec: 5

databases:
  - name: philtech-payroll-db
    databaseName: payroll_db
    user: payroll_user
    ipAllowList: []

    plan: free
    postgresMajorVersion: 15